# -----------------------------------------------------------------------------
# GENERAL
# -----------------------------------------------------------------------------

set -g mouse on
set -g history-limit 100000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm-256color:Tc"

setw -g mode-keys vi

# -----------------------------------------------------------------------------
# RELOAD CONFIG
# -----------------------------------------------------------------------------

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"

# -----------------------------------------------------------------------------
# RESIZE PANES
# -----------------------------------------------------------------------------

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# -----------------------------------------------------------------------------
# STATUS BAR
# -----------------------------------------------------------------------------

set -g status-position top
set -g status-justify left

set -g status-left-length 100
set -g status-right-length 100

set -g status-left ""
set -g status-right ""

# -----------------------------------------------------------------------------
# THEME
# -----------------------------------------------------------------------------

source-file ~/.config/tmux/themes/kanagawa/kanagawa-wave.conf
source-file ~/.config/tmux/themes/kanagawa/main.conf

# -----------------------------------------------------------------------------
# PLUGINS
# -----------------------------------------------------------------------------

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'


# --- STATUS RIGHT (MANUAL) ---
# --- STATUS RIGHT (BEAUTIFIED) ---
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""

# Module: CPU (Kanagawa Cyan/Blue accent)
set -g status-right "#[fg=#{@kanagawa_accent}]#[fg=#{@kanagawa_bg},bg=#{@kanagawa_accent}]󰍛 #{cpu_percentage}#[fg=#{@kanagawa_accent},bg=default]"

# Module: Battery (Kanagawa Active/Yellow accent)
set -ag status-right " #[fg=#{@kanagawa_active}]#[fg=#{@kanagawa_bg},bg=#{@kanagawa_active}]󰁹 #{battery_percentage}#[fg=#{@kanagawa_active},bg=default]"

# Module: Session Name (Kanagawa Magenta accent)
set -ag status-left " #[fg=#{@kanagawa_magenta}]#[fg=#{@kanagawa_bg},bg=#{@kanagawa_magenta}]󱫋 #S#[fg=#{@kanagawa_magenta},bg=default]"

# Module: Time (Kanagawa Blue/Gray accent)
set -ag status-right " #[fg=#{@kanagawa_cyan}]#[fg=#{@kanagawa_bg},bg=#{@kanagawa_cyan}]󱑒 %H:%M#[fg=#{@kanagawa_cyan},bg=default]"



run '~/.config/tmux/plugins/tpm/tpm'
# ~/.config/tmux/themes/kanagawa/main.conf

# 1. Basic Status Bar Styling
set -g status-style "bg=default,fg=#{@kanagawa_fg}"
set -g status-bg default

# 2. Window Status (Inactive Tabs)
setw -g window-status-style "fg=#{@kanagawa_accent},bg=default"
setw -g window-status-format " #[fg=#{@kanagawa_accent}]#I #[fg=#{@kanagawa_fg}]#W "

# 3. Window Status (Active Tab - Rounded)
setw -g window-status-current-format " #[fg=#{@kanagawa_active}]#[fg=#{@kanagawa_bg},bg=#{@kanagawa_active}]#I #W#[fg=#{@kanagawa_active},bg=default]"

# 4. Pane & Message Styling
set -g pane-border-style "fg=#2a2a37"
set -g pane-active-border-style "fg=#{@kanagawa_accent}"
set -g message-style "bg=#{@kanagawa_bg},fg=#{@kanagawa_accent}"